<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SRS Польский B1: Слепой лист</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131d2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-active: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #23354d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px 12px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .dashboard-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .dash-label {
      font-weight: 600;
      color: var(--text);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dash-stats {
      display: flex;
      gap: 12px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
    }

    .stat-badge.success {
      color: var(--success);
    }

    .stat-badge.danger {
      color: var(--danger);
    }

    .stat-badge.neutral {
      color: var(--text-muted);
    }

    .progress-bar-container {
      background: var(--bg);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }

    .sheet-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .sheet-card.state-success {
      border-color: var(--success);
      background-color: rgba(34, 197, 94, 0.06);
    }

    .sheet-card.state-error {
      border-color: var(--danger);
      background-color: rgba(239, 68, 68, 0.06);
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .sheet-prompt-box {
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .sheet-prompt-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .sheet-prompt {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 14px 12px;
      border-radius: 8px;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"].input-success {
      border-color: var(--success) !important;
      background-color: rgba(34, 197, 94, 0.12);
      color: #86efac;
    }

    input[type="text"].input-error {
      border-color: var(--danger) !important;
      background-color: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
    }

    .main-btn {
      background: var(--accent);
      color: #090d16;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background 0.15s;
    }

    .main-btn:active {
      background: var(--accent-active);
    }

    .main-btn.btn-success {
      background: var(--success);
      color: #052e16;
    }

    .main-btn.btn-error {
      background: var(--danger);
      color: #450a0a;
    }

    .keyboard-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      margin-top: 2px;
    }

    .char-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 0;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }

    .char-btn:active {
      background: var(--border);
    }

    .feedback-box {
      display: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .feedback-box.success {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: #86efac;
    }

    .feedback-box.error {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .feedback-header {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
    }

    .comp-row {
      display: flex;
      justify-content: space-between;
    }

    .comp-label {
      color: var(--text-muted);
    }

    .comp-value {
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Польский B1: SRS</h1>
    <div class="header-actions">
      <button type="button" class="btn-secondary" onclick="resetSessionStats()">Сброс сессии</button>
      <button type="button" class="btn-secondary" onclick="resetProgress()">Сброс раздела</button>
    </div>
  </header>

  <div class="controls-grid">
    <div class="control-group">
      <label for="sectionSelect">Раздел</label>
      <select id="sectionSelect"></select>
    </div>
    <div class="control-group">
      <label for="directionSelect">Направление</label>
      <select id="directionSelect">
        <option value="ru-pl">RU → PL (Слепой лист)</option>
        <option value="pl-ru">PL → RU</option>
      </select>
    </div>
  </div>

  <div class="dashboard-panel">
    <div class="dash-row">
      <span class="dash-label">Текущая сессия</span>
      <div class="dash-stats">
        <span class="stat-badge success">✓ <span id="sessionCorrect">0</span></span>
        <span class="stat-badge danger">✕ <span id="sessionWrong">0</span></span>
        <span class="stat-badge neutral">Всего: <span id="sessionTotal">0</span></span>
      </div>
    </div>
    <div class="dash-row" style="margin-top: 4px;">
      <span class="dash-label">Общий прогресс раздела</span>
      <div class="dash-stats">
        <span class="stat-badge neutral">Осталось: <b id="wordsRemaining" style="color: var(--text);">0</b></span>
        <span class="stat-badge neutral">Выучено: <span id="overallRatio">0 / 0</span></span>
      </div>
    </div>
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>

  <div class="sheet-card" id="cardContainer">
    <div class="sheet-prompt-box">
      <div id="promptSideLabel" class="sheet-prompt-label">Русский</div>
      <div id="promptTerm" class="sheet-prompt">...</div>
    </div>

    <div class="keyboard-grid" id="diacriticsBar">
      <button type="button" class="char-btn" onpointerdown="insertChar('ą', event)">ą</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ć', event)">ć</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ę', event)">ę</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ł', event)">ł</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ń', event)">ń</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ó', event)">ó</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ś', event)">ś</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ź', event)">ź</button>
      <button type="button" class="char-btn" onpointerdown="insertChar('ż', event)">ż</button>
    </div>

    <form id="quizForm" onsubmit="handleAnswer(event)">
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Напишите перевод..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" required>
        <button type="submit" id="actionBtn" class="main-btn">Проверить</button>
      </div>
    </form>

    <div id="feedbackBox" class="feedback-box"></div>
  </div>
</div>

  { s: "17. Opinia i argumentacja", pl: "Z jednej strony..., z drugiej...", ru: "С одной / другой стороны..." },
  { s: "17. Opinia i argumentacja", pl: "Przede wszystkim należy...", ru: "Прежде всего следует..." },
  { s: "17. Opinia i argumentacja", pl: "Warto zauważyć, że...", ru: "Стоит заметить, что..." },
  { s: "17. Opinia i argumentacja", pl: "Podsumowując / Reasumując...", ru: "Подводя итог..." },
  { s: "17. Opinia i argumentacja", pl: "Na zakończenie chciałbym...", ru: "В заключение хотелось бы..." }
];

let state = {
  currentSection: "ALL",
  direction: "ru-pl",
  currentIndex: -1,
  awaitingNext: false,
  srsScores: {},
  session: {
    correct: 0,
    wrong: 0
  }
};

function init() {
  const savedScores = localStorage.getItem("srs_polish_scores");
  if (savedScores) {
    try {
      state.srsScores = JSON.parse(savedScores);
    } catch(e) {
      state.srsScores = {};
    }
  }

  const sectionSelect = document.getElementById("sectionSelect");
  const uniqueSections = [...new Set(VOCABULARY_DATA.map(i => i.s))];
  
  const allOpt = document.createElement("option");
  allOpt.value = "ALL";
  allOpt.textContent = "Все разделы (B1)";
  sectionSelect.appendChild(allOpt);

  uniqueSections.forEach(sec => {
    const opt = document.createElement("option");
    opt.value = sec;
    opt.textContent = sec;
    sectionSelect.appendChild(opt);
  });

  sectionSelect.addEventListener("change", (e) => {
    state.currentSection = e.target.value;
    loadNextWord();
  });

  const dirSelect = document.getElementById("directionSelect");
  dirSelect.addEventListener("change", (e) => {
    state.direction = e.target.value;
    const diacritics = document.getElementById("diacriticsBar");
    diacritics.style.display = state.direction === "ru-pl" ? "grid" : "none";
    loadNextWord();
  });

  updateDashboard();
  loadNextWord();
}

function saveScores() {
  localStorage.setItem("srs_polish_scores", JSON.stringify(state.srsScores));
}

function getFilteredPool() {
  return VOCABULARY_DATA.filter(item => {
    if (state.currentSection !== "ALL" && item.s !== state.currentSection) return false;
    const score = state.srsScores[item.pl] || 0;
    return score < 3;
  });
}

function updateDashboard() {
  document.getElementById("sessionCorrect").textContent = state.session.correct;
  document.getElementById("sessionWrong").textContent = state.session.wrong;
  document.getElementById("sessionTotal").textContent = state.session.correct + state.session.wrong;

  const totalInSection = VOCABULARY_DATA.filter(item => 
    state.currentSection === "ALL" || item.s === state.currentSection
  );
  const mastered = totalInSection.filter(item => (state.srsScores[item.pl] || 0) >= 3);
  
  const total = totalInSection.length;
  const countMastered = mastered.length;
  const countRemaining = total - countMastered;

  document.getElementById("wordsRemaining").textContent = countRemaining;
  document.getElementById("overallRatio").textContent = `${countMastered} / ${total}`;
  
  const pct = total > 0 ? (countMastered / total) * 100 : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

function resetSessionStats() {
  state.session.correct = 0;
  state.session.wrong = 0;
  updateDashboard();
}

function resetVisualStates() {
  const card = document.getElementById("cardContainer");
  const input = document.getElementById("userInput");
  const actionBtn = document.getElementById("actionBtn");
  const feedbackBox = document.getElementById("feedbackBox");

  card.classList.remove("state-success", "state-error");
  input.classList.remove("input-success", "input-error");
  actionBtn.classList.remove("btn-success", "btn-error");

  feedbackBox.className = "feedback-box";
  feedbackBox.style.display = "none";
  feedbackBox.innerHTML = "";
}

function loadNextWord() {
  state.awaitingNext = false;
  resetVisualStates();
  
  const actionBtn = document.getElementById("actionBtn");
  actionBtn.textContent = "Проверить";
  
  const input = document.getElementById("userInput");
  input.value = "";
  input.disabled = false;

  updateDashboard();
  const pool = getFilteredPool();

  if (pool.length === 0) {
    document.getElementById("promptSideLabel").textContent = "Статус";
    document.getElementById("promptTerm").textContent = "Все слова раздела выучены!";
    input.style.display = "none";
    actionBtn.style.display = "none";
    return;
  }

  input.style.display = "block";
  actionBtn.style.display = "block";

  const nextItem = pool[Math.floor(Math.random() * pool.length)];
  state.currentIndex = VOCABULARY_DATA.findIndex(i => i.pl === nextItem.pl && i.ru === nextItem.ru);

  if (state.direction === "ru-pl") {
    document.getElementById("promptSideLabel").textContent = "Русский (Слепой лист)";
    document.getElementById("promptTerm").textContent = nextItem.ru;
  } else {
    document.getElementById("promptSideLabel").textContent = "Польский";
    document.getElementById("promptTerm").textContent = nextItem.pl;
  }
}

function normalize(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
    .replace(/\s+/g, " ");
}

function checkAccuracy(userVal, targetVal) {
  const cleanUser = normalize(userVal);
  const rawVariants = targetVal.split(/[\/;]/);
  const variants = rawVariants.map(v => normalize(v));

  if (variants.includes(cleanUser)) return true;
  if (normalize(targetVal) === cleanUser) return true;

  const joinedDirect = targetVal.split("/").map(v => normalize(v)).join(" ");
  return cleanUser === joinedDirect;
}

function handleAnswer(event) {
  event.preventDefault();
  
  if (state.awaitingNext) {
    loadNextWord();
    return;
  }

  const currentItem = VOCABULARY_DATA[state.currentIndex];
  const input = document.getElementById("userInput");
  const card = document.getElementById("cardContainer");
  const actionBtn = document.getElementById("actionBtn");
  const feedbackBox = document.getElementById("feedbackBox");

  const val = input.value;
  const targetAnswer = state.direction === "ru-pl" ? currentItem.pl : currentItem.ru;
  const isCorrect = checkAccuracy(val, targetAnswer);
  const wordKey = currentItem.pl;
  const currentStreak = state.srsScores[wordKey] || 0;

  if (isCorrect) {
    state.session.correct++;
    state.srsScores[wordKey] = currentStreak + 1;
    card.classList.add("state-success");
    input.classList.add("input-success");
    actionBtn.classList.add("btn-success");
    feedbackBox.className = "feedback-box success";
    feedbackBox.innerHTML = `
      <div class="feedback-header">✓ Абсолютно верно</div>
      <div>Серия правильных ответов: <b>${state.srsScores[wordKey]} из 3</b></div>
      <div class="comparison-grid">
        <div class="comp-row">
          <span class="comp-label">Эталон:</span>
          <span class="comp-value">${targetAnswer}</span>
        </div>
      </div>
    `;
  } else {
    state.session.wrong++;
    state.srsScores[wordKey] = 0;
    card.classList.add("state-error");
    input.classList.add("input-error");
    actionBtn.classList.add("btn-error");
    feedbackBox.className = "feedback-box error";
    feedbackBox.innerHTML = `
      <div class="feedback-header">✕ Ошибка в правописании</div>
      <div>Счетчик сброшен до <b>0 из 3</b>.</div>
      <div class="comparison-grid">
        <div class="comp-row">
          <span class="comp-label">Ваш ввод:</span>
          <span class="comp-value" style="color: #fca5a5;">${val || "—"}</span>
        </div>
        <div class="comp-row">
          <span class="comp-label">Правильно:</span>
          <span class="comp-value" style="color: #86efac;">${targetAnswer}</span>
        </div>
      </div>
    `;
  }

  saveScores();
  updateDashboard();
  
  state.awaitingNext = true;
  input.disabled = true;
  actionBtn.textContent = "Дальше ➔";
}

function insertChar(char, event) {
  if (event) event.preventDefault();
  const input = document.getElementById("userInput");
  if (input.disabled) return;
  const start = input.selectionStart || input.value.length;
  const end = input.selectionEnd || input.value.length;
  const val = input.value;
  input.value = val.substring(0, start) + char + val.substring(end);
  input.selectionStart = input.selectionEnd = start + 1;
}

function resetProgress() {
  const totalInSection = VOCABULARY_DATA.filter(item => 
    state.currentSection === "ALL" || item.s === state.currentSection
  );
  totalInSection.forEach(item => {
    delete state.srsScores[item.pl];
  });
  saveScores();
  loadNextWord();
}

window.onload = init;
</script>
</body>
